# ══════════════════════════════════════════════════════════════════════
#  BTC Trader — main configuration
#  API keys and secrets go in config/.env (never here)
# ══════════════════════════════════════════════════════════════════════

# ── Trading mode ──────────────────────────────────────────────────────
# dry_run : live data, signals logged + Telegram only, NO orders placed
# paper   : live data, simulated fills (Binance testnet or internal sim)
# live    : real orders on real Binance Futures account
mode: dry_run

# ── Instrument ────────────────────────────────────────────────────────
instrument:
  symbol: BTCUSDT            # raw Binance symbol
  nt_id: BTCUSDT-PERP.BINANCE  # NautilusTrader instrument ID
  venue: BINANCE
  account_type: USDT_FUTURES   # Binance account type for this symbol

# ── Timeframes ────────────────────────────────────────────────────────
# primary  : bar type used for signal generation
# htf      : higher timeframe used for bias filter
# Additional timeframes can be added here in Stage 7
timeframes:
  primary: 15m
  htf: 1h

# ── Strategy ──────────────────────────────────────────────────────────
strategy:
  name: ms_htf               # which strategy class to load

  # Market structure parameters
  swing_len: 10              # pivot lookback bars each side
  atr_dist: 0.5              # min ATR distance between opposite pivots
  atr_len: 14                # ATR period inside the MS engine

  # HTF bias
  htf_filter: true           # require 1H HMA agreement before entry
  htf_period: 21             # HMA period on the HTF

# ── Risk management ───────────────────────────────────────────────────
risk:
  trade_size: 0.001          # BTC per trade (start very small)

  sl_atr: 1.5                # stop loss distance × ATR
  tp1_atr: 2.0               # TP1 distance × ATR  (closes 50%)
  tp2_atr: 3.5               # TP2 distance × ATR  (closes remainder)

  trailing_tp2: false        # trailing TP2 (false = fixed level)
  trail_atr_mult: 3.5        # trailing callback distance × ATR (if above is true)
  breakeven_sl: true         # move SL to entry once TP1 fires
  enable_exit_signal: true   # close on opposite momentum signal

  max_open_trades: 5         # hard cap on simultaneously open trades
  daily_loss_limit_usdt: 50.0  # no new entries if daily PnL drops below this

# ── Redis ─────────────────────────────────────────────────────────────
# Required by NautilusTrader's live TradingNode for internal cache state
redis:
  host: localhost
  port: 6379
  timeout_secs: 20

# ── Logging ───────────────────────────────────────────────────────────
logging:
  level: INFO                # console log level: DEBUG | INFO | WARNING | ERROR
  level_file: DEBUG          # file log level (more verbose than console)
  log_dir: logs              # relative to project root
  log_file_name: btc_trader.log
  rotate_mb: 50              # rotate log file after this many MB
  keep_backups: 5            # how many rotated files to keep

# ── Telegram ──────────────────────────────────────────────────────────
# Bot token and chat_id go in config/.env
telegram:
  enabled: false             # set to true once bot is configured
  notify_signals: true       # send a message when a signal is detected
  notify_entries: true       # send a message when a trade opens
  notify_exits: true         # send a message when a trade closes (SL/TP/etc)
  notify_daily_summary: true
  daily_summary_utc: "00:00" # time to send the daily summary (UTC)
  heartbeat_interval_mins: 60  # send a silent ✅ every N minutes (0 = disable)
